<style>
:root{
  --bg:#2F4D3C; --surface:#38594A; --ink:#F4F1E8; --muted:#C9D5CC;
  --pine:#F3E39A; --pine-soft:rgba(255,255,255,.12); --seal:#F4A6A0; --line:rgba(244,241,232,.28);
  --note:rgba(0,0,0,.18); --on-pine:#1E3328; --on-accent:#1E3328; --wood:#7A4E2D; --wood-dark:#5C3920;
  color-scheme: dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1F332A; --surface:#284236; --ink:#ECE9DF; --muted:#B3C2B8;
    --pine:#E8D884; --seal:#E99A93; --note:rgba(0,0,0,.25); --wood:#5E3C22; --wood-dark:#432914;
  }
}
:root[data-theme="dark"]{
  --bg:#1F332A; --surface:#284236; --ink:#ECE9DF; --muted:#B3C2B8;
  --pine:#E8D884; --seal:#E99A93; --note:rgba(0,0,0,.25); --wood:#5E3C22; --wood-dark:#432914;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:transparent;color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
html{background:var(--sky);background-attachment:fixed;min-height:100%}
:root{--sky:var(--bg)}

  :root:not([data-theme="light"])[data-scene="mountain"],:root:not([data-theme="light"])[data-scene="danxia"],:root:not([data-theme="light"])[data-scene="flight"]{--bg:#18211E;--ink:#E6EEE9;--muted:#A2B4AA;--surface:#222D29;--panel:rgba(24,33,30,.88);--line:#33413B;--pine:#86C4A3;--seal:#E26F63;--on-accent:#141B18;--on-pine:#141B18;--note:#202A26;--pine-soft:#24352D;--sky:linear-gradient(#141B18,#1E2925);color-scheme:dark}
  :root:not([data-theme="light"]):is([data-scene="mountain"],[data-scene="danxia"],[data-scene="flight"]) body::after{opacity:.3}
}
:root[data-theme="dark"][data-scene="mountain"],:root[data-theme="dark"][data-scene="danxia"],:root[data-theme="dark"][data-scene="flight"]{--bg:#18211E;--ink:#E6EEE9;--muted:#A2B4AA;--surface:#222D29;--panel:rgba(24,33,30,.88);--line:#33413B;--pine:#86C4A3;--seal:#E26F63;--on-accent:#141B18;--on-pine:#141B18;--note:#202A26;--pine-soft:#24352D;--sky:linear-gradient(#141B18,#1E2925);color-scheme:dark}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:55vh;background:var(--art,none) center bottom/cover no-repeat;z-index:-1;pointer-events:none}
:root[data-scene="chalk"] body::after{display:none}
:root:not([data-scene="chalk"]) .ledge,:root:not([data-scene="chalk"]) .tray{display:none}
:root:not([data-scene="chalk"]) #view{background:var(--panel);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:16px;padding:2px 14px 16px;margin-top:14px}
:root:not([data-scene="chalk"]) .sticky{background:var(--bg)}
nav.days[hidden]{display:none}
.scene-banner{height:150px;border-radius:12px;margin:14px 0 0;background:var(--sky);position:relative;overflow:hidden}
.scene-banner::after{content:"";position:absolute;inset:0;background:var(--art,none) center bottom/cover no-repeat}

:root[data-scene="board"]{--bg:#B98A5C;--ink:#2B1E14;--muted:#4A3726;--surface:#FFFBF0;--panel:transparent;--line:#D9C6A5;--pine:#2E5A45;--seal:#B3352B;--on-accent:#FFFFFF;--on-pine:#FFFFFF;--note:#FFF4D6;--pine-soft:#EADFC8;--paper:#FFFBF0;--paper-ink:#2B1E14;--paper-muted:#6B5440;
  --sky:radial-gradient(circle at 20% 30%,rgba(90,55,25,.25) 0 1.5px,transparent 2px) 0 0/23px 19px,radial-gradient(circle at 70% 60%,rgba(255,235,200,.25) 0 1.5px,transparent 2px) 0 0/31px 27px,radial-gradient(circle at 40% 80%,rgba(70,40,15,.2) 0 1px,transparent 1.5px) 0 0/17px 13px,#B98A5C;--art:none;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-scene="board"]{--bg:#4A3524;--ink:#F3E9DA;--muted:#D8C6AF;--surface:#2E241B;--line:#5C4733;--pine:#86C4A3;--seal:#E26F63;--on-accent:#1E1610;--on-pine:#1E1610;--note:#3A2E22;--pine-soft:#3A2E22;--paper:#F6EEDC;--paper-ink:#2B1E14;--paper-muted:#6B5440;--sky:radial-gradient(circle at 20% 30%,rgba(0,0,0,.25) 0 1.5px,transparent 2px) 0 0/23px 19px,radial-gradient(circle at 70% 60%,rgba(255,235,200,.08) 0 1.5px,transparent 2px) 0 0/31px 27px,#4A3524;color-scheme:dark}}
:root[data-theme="dark"][data-scene="board"]{--bg:#4A3524;--ink:#F3E9DA;--muted:#D8C6AF;--surface:#2E241B;--line:#5C4733;--pine:#86C4A3;--seal:#E26F63;--on-accent:#1E1610;--on-pine:#1E1610;--note:#3A2E22;--pine-soft:#3A2E22;--paper:#F6EEDC;--paper-ink:#2B1E14;--paper-muted:#6B5440;--sky:radial-gradient(circle at 20% 30%,rgba(0,0,0,.25) 0 1.5px,transparent 2px) 0 0/23px 19px,#4A3524;color-scheme:dark}
:root[data-scene="board"] #view{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0}
:root[data-scene="board"] body::after{display:none}
.friends h3{font-family:"Nanum Pen Script","Gowun Dodum",cursive;font-weight:400;font-size:28px;margin:0 0 8px;line-height:1.2}
.paper{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:16px;margin-top:16px;box-shadow:0 2px 0 rgba(0,0,0,.06),0 6px 14px rgba(40,20,0,.25);transform:rotate(var(--r,0deg))}
.paper::before,.fcard::before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff9a8a,#B3352B 60%,#7a1f17);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.paper label,.paper .status{color:var(--paper-muted)}
.paper textarea{background:#fff;color:var(--paper-ink);border-color:#D9C6A5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:16px;min-height:42px;padding:6px 14px;border-radius:999px;border:1.5px solid #B3352B;background:#fff;color:#2B1E14;cursor:pointer}
.chip[aria-pressed="true"]{background:#B3352B;color:#fff}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;margin-top:22px}
.fcard{position:relative;text-align:left;font:inherit;color:var(--paper-ink);background:var(--paper);border:none;border-radius:4px;padding:16px 12px 12px;cursor:pointer;box-shadow:0 6px 12px rgba(40,20,0,.25);transform:rotate(var(--r,0deg));min-height:96px}
.fcard:nth-child(3n+2){background:#FFF3B8}.fcard:nth-child(3n){background:#DDEFE3}
.fcard.open{grid-column:1/-1;transform:none}
.fcard.me{outline:3px solid #B3352B;outline-offset:2px}
.ftop{display:flex;gap:10px;align-items:center}
.ftop small{display:block;font-size:13px;color:var(--paper-muted)}
.avatar{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#2E5A45;color:#fff;font-family:"Nanum Pen Script","Gowun Dodum",cursive;font-size:19px;white-space:nowrap;letter-spacing:-1px;overflow:hidden}
.snip{margin:8px 0 0;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.full{margin:8px 0 0;font-size:16px;overflow-wrap:anywhere;white-space:pre-wrap}
.full b{color:#B3352B;font-weight:700}
.boardtitle{margin-top:28px!important;color:var(--ink)}
.post .ptop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.post .dl{font-size:14px;color:#B3352B}
.post p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.post .del{border:none;background:none;color:var(--paper-muted);font:inherit;font-size:14px;cursor:pointer;padding:6px 0 0}
.votetable th{text-align:left;font-size:14px;color:var(--muted);font-weight:400;padding:6px 4px;border-bottom:1px solid var(--line)}
.votetable td.cnt{font-weight:700;color:var(--pine);white-space:nowrap}
.votetable td.names{font-size:14px;color:var(--muted);text-align:left!important;white-space:normal!important}
.votetable td:nth-child(2){white-space:nowrap}
.namechips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chalkset{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chalkset svg{flex:none}
.doodle-row{display:flex;justify-content:space-around;align-items:center;flex-wrap:wrap;gap:10px;margin:22px 0 4px;opacity:.85}

  let localPhotos = [];   // {key, place, by, at, url}
  function idb(){
    return new Promise((res, rej) => {
      if (!("indexedDB" in window)) return rej(new Error("no idb"));
      const r = indexedDB.open("dsc12-proto", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("photos", {keyPath:"key"});
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  }
  async function idbTx(mode, fn){
    const d = await idb();
    return new Promise((res, rej) => {
      const tx = d.transaction("photos", mode); const st = tx.objectStore("photos");
      const out = fn(st);
      tx.oncomplete = () => res(out && out.result); tx.onerror = () => rej(tx.error);
    });
  }
  async function loadPhotos(){
    try {
      const rows = await idbTx("readonly", st => st.getAll());
      localPhotos.forEach(p => URL.revokeObjectURL(p.url));
      localPhotos = (rows || []).filter(r => r && r.blob).map(r => ({key:r.key, place:r.place, by:r.by, at:r.at, url:URL.createObjectURL(r.blob)}));
    } catch(e){ localPhotos = []; }
  }

  async function shrink(file){
    try {
      const bmp = await createImageBitmap(file);
      const max = 1600, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas"); c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      const b = await new Promise(res => c.toBlob(res, "image/jpeg", 0.82));
      return b || file;
    } catch(e){ return file; }
  }

  async function removePhoto(p){
    if (online){
      try {
        await sb.storage.from("photos").remove([p.path]);
        await sb.from("photos").delete().eq("id", p.key).eq("owner", myId);
      } catch(e){}
      await refreshRemote();
    } else {
      try { await idbTx("readwrite", st => st.delete(p.key)); } catch(e){}
      await loadPhotos();
    }
    render();
  }

  function fillPanel(panel, it, list){
    const friends = list.filter(n => !n.me);
    if (!friends.length) panel.appendChild(el("p","empty", online ? "아직 친구들 느낌이 없어요. 먼저 남겨 보세요." : "공유 설정 전이라 느낌이 이 폰에만 저장돼요."));
    friends.forEach(n => { const d = el("div","note"); d.appendChild(el("div","who",n.who)); d.appendChild(el("p",null,n.text)); panel.appendChild(d); });
    if (!nick) panel.appendChild(el('p','status','맨 위 「나는」에서 내 이름을 선택해 줘.'));
    const lt = el("label",null, it.name + "에서 내 느낌"); lt.htmlFor = "t-" + it.id; lt.style.marginTop = "8px";
    const ta = el("textarea"); ta.id = "t-" + it.id; ta.maxLength = 1000; ta.value = myNotes[it.id] || "";
    ta.placeholder = "보고 느낀 것, 맛있었던 것, 기억하고 싶은 장면";
    panel.appendChild(lt); panel.appendChild(ta);
    const r = el("div","row"); const sbtn = el("button","btn","저장"); sbtn.type = "button";
    const st = el("span","status", online ? "저장하면 모두가 볼 수 있어요" : "이 폰에 저장돼요"); st.setAttribute("aria-live","polite");
    sbtn.addEventListener("click", async () => {
      if(!nick){st.textContent='맨 위 「나는」에서 내 이름을 선택해 줘.';document.getElementById('shared-name').focus();return;}
      myNotes[it.id] = ta.value.trim(); if (!myNotes[it.id]) delete myNotes[it.id];
      LS.set("dsc12_notes", myNotes);
      sbtn.disabled = true; st.textContent = "저장 중";
      const ok = await saveNoteRemote(it.id, myNotes[it.id] || "");
      sbtn.disabled = false;
      st.textContent = !online ? "이 폰에 저장했어요" : ok ? "저장했어요. 모두가 볼 수 있어요" : "인터넷 문제로 이 폰에만 저장했어요";
      const f = panel.previousSibling && panel.previousSibling.querySelector(".feel");
      if (f){ const n = notesFor(it.id).length; f.textContent = n ? "느낌 " + n : "느낌 쓰기"; }
    });
    r.appendChild(sbtn); r.appendChild(st); panel.appendChild(r);
  }

  function copyDay(day, box){
    const lines = ["[" + day.sub + " " + day.title + "] 동산초 12회 답사기"];
    day.items.filter(i => i.id).forEach(it => {
      const list = notesFor(it.id); if (!list.length) return;
      lines.push("", "■ " + it.name);
      list.forEach(n => lines.push("- " + n.who.replace(" (나)","") + ": " + n.text));
    });
    box.textContent = "";
    if (lines.length === 1){ box.appendChild(el("p","status","아직 적힌 느낌이 없어요.")); return; }
    const text = lines.join("\n");
    const done = () => { box.textContent = ""; box.appendChild(el("p","status","복사했어요. 단톡방에 붙여 넣으세요.")); };
    const fallback = () => {
      box.textContent = "";
      const ta = el("textarea"); ta.value = text; ta.readOnly = true; ta.setAttribute("aria-label","복사할 내용");
      box.appendChild(el("p","status","아래 글을 길게 눌러 전체 선택 후 복사하세요.")); box.appendChild(ta); ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  }

  async function saveNoteRemote(place, body){
    if (!online) return false;
    try {
      const r = body
        ? await sb.from("notes").upsert({owner:myId, nick:nick, place:place, body:body.slice(0,1000), updated_at:new Date().toISOString()}, {onConflict:"owner,place"})
        : await sb.from("notes").delete().eq("owner", myId).eq("place", place);
      if (r.error) throw r.error;
      await refreshRemote();
      return true;
    } catch(e){ return false; }
  }

  const PLACE_IDS = new Set(DAYS.flatMap(d => d.items.filter(i => i.id).map(i => i.id)));
  const str = (v, n) => typeof v === "string" ? v.slice(0, n) : "";

  async function refreshRemote(){
    if (!online) return;
    try {
      const [n, v, p, h] = await Promise.all([
        sb.from("notes").select("owner,nick,place,body"),
        sb.from("votes").select("owner,nick,option"),
        sb.from("photos").select("id,owner,by_name,place,path,created_at").order("created_at", {ascending:true}).limit(1000),
        sb.from("hearts").select("id,owner,nick,body,created_at").order("created_at", {ascending:false}).limit(500)
      ]);
      if (!h.error) remoteHearts = (h.data || []).filter(r => r && typeof r.body === "string").map(r => ({
        key:r.id, owner:r.owner, nick:str(r.nick, 20) || "친구", body:str(r.body, 500), at:Date.parse(r.created_at) || 0, mine:r.owner === myId
      }));
      if (!n.error){
        roleRows = decodeRoleRows(n.data || []);
        const next = {};
        (n.data || []).forEach(r => {
          if (!r || !PLACE_IDS.has(r.place)) return;
          const o = next[r.owner] || (next[r.owner] = {nick: str(r.nick, 20), notes:{}});
          o.notes[r.place] = str(r.body, 1000);
          if (r.owner === myId && !(r.place in myNotes)) myNotes[r.place] = o.notes[r.place];
        });
        others = next; LS.set("dsc12_notes", myNotes);
      }
      if (!v.error) remoteVotes = (v.data || []).filter(r => r && OPT_IDS.has(r.option)).map(r => ({owner:r.owner, nick:str(r.nick, 20), option:r.option}));
      if (!p.error) remotePhotos = (p.data || []).filter(r => r && PLACE_IDS.has(r.place) && typeof r.path === "string").map(r => ({
        key:r.id, owner:r.owner, by:str(r.by_name, 20) || "친구", place:r.place, path:r.path,
        url: sb.storage.from("photos").getPublicUrl(r.path).data.publicUrl, at: Date.parse(r.created_at) || 0, mine: r.owner === myId
      }));
      if(n.error||v.error||p.error||h.error)setSync("일부 공유 정보를 불러오지 못했어요. 새로고침해 주세요");
      else setSync("모두에게 공유 중");
    } catch(e){ setSync("인터넷 연결을 확인해 주세요"); }
  }

  function setSync(t){ syncMsg = t; const e = document.getElementById("syncState"); if (e) e.textContent = t; }
  function softRender(){ const a = document.activeElement; if (!(a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT"))) render(); }

  async function initRemote(){
    if (!SUPABASE_URL || !SUPABASE_ANON_KEY){ setSync("공유 설정 전: 입력한 내용은 이 폰에만 저장돼요"); return; }
    if (!window.supabase || !window.supabase.createClient){ setSync("공유 기능을 불러오지 못했어요. 인터넷을 확인해 주세요"); return; }
    try {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      let { data } = await sb.auth.getSession();
      let session = data && data.session;
      if (!session){
        const r = await sb.auth.signInAnonymously();
        if (r.error) throw r.error;
        session = r.data.session;
      }
      myId = session.user.id; online = true;
      // 이 폰에만 있던 느낌과 투표를 서버로 옮기기 (처음 한 번)
      if (!LS.get("dsc12_migrated", false)){
        for (const k of Object.keys(myNotes)) if (PLACE_IDS.has(k) && myNotes[k]) await sb.from("notes").upsert({owner:myId, nick:nick, place:k, body:myNotes[k].slice(0,1000)}, {onConflict:"owner,place"});
        if (nick) for (const k of Object.keys(myVotes)) if (OPT_IDS.has(k)) await sb.from("votes").upsert({owner:myId, nick:nick, option:k}, {onConflict:"owner,option"});
        LS.set("dsc12_migrated", true);
      }
      await refreshRemote(); render();
      setInterval(() => { if (!document.hidden) refreshRemote().then(softRender); }, 20000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshRemote().then(softRender); });
    } catch(e){
      online = false; sb = null;
      setSync("공유 서버에 연결하지 못했어요. 지금은 이 폰에만 저장돼요");
    }
  }

  function fromHash(){
    if (location.hash === "#trip") stage = "trip"; else if (location.hash === "#prep") stage = "prep"; else if (location.hash === "#friends") stage = "friends";
    renderNav(); render();
  }
  window.addEventListener("hashchange", () => { fromHash(); window.scrollTo({top:0}); });
  renderNav(); render(); loadPhotos().then(() => { if (stage === "trip") render(); }); initRemote();
})();
</script>
